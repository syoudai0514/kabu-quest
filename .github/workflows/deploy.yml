# GitHub Pagesへの自動デプロイ
# 初回のみ: リポジトリの Settings → Pages → Build and deployment →
# Source を「GitHub Actions」にすること。
# 公開URL: https://syoudai0514.github.io/kabu-quest/
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/investment-game-design-ltcpnz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pagesが未有効ならこのステップが自動で有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /kabu-quest/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
